server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/exam_attendance?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  seed:
    enabled: false
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-strong-secret-key-with-at-least-32-characters}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
